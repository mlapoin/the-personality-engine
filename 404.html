<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Personality Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f0e8; color: #111; font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
    .container { width: 100%; max-width: 540px; display: flex; flex-direction: column; text-align: center; }
    .masthead { border-top: 4px solid #111; border-bottom: 1.5px solid #111; padding: 0.6rem 0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .masthead-left, .masthead-right { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: #555; letter-spacing: 0.1em; }
    h1 { font-family: 'Playfair Display', serif; font-size: clamp(5rem, 22vw, 10rem); font-weight: 900; line-height: 0.88; letter-spacing: -0.02em; color: #111; border-bottom: 1.5px solid #111; padding-bottom: 1rem; margin-bottom: 1rem; }
    h1 em { font-style: italic; color: #c0001a; }
    .deck { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 900; color: #111; margin-bottom: 0.5rem; }
    .sub { font-family: 'DM Sans', sans-serif; font-size: 0.85rem; color: #777; margin-bottom: 2rem; line-height: 1.6; border-bottom: 1px solid #ccc; padding-bottom: 1.5rem; }
    .back { display: inline-block; background: #111; color: #f5f0e8; font-family: 'Playfair Display', serif; font-size: 0.95rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.9rem 1.75rem; text-decoration: none; transition: background 0.15s; }
    .back:hover { background: #333; }
    footer { margin-top: 2rem; border-top: 1px solid #ccc; padding-top: 0.75rem; font-family: 'DM Mono', monospace; font-size: 0.55rem; color: #aaa; letter-spacing: 0.08em; display: flex; justify-content: space-between; }
  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23c0001a%22/></svg>" />
</head>
<body>
  <div class="container">
    <div class="masthead">
      <span class="masthead-left">EST. 2026</span>
      <span class="masthead-right">DON'T SHOOT THE MESSENGER.</span>
    </div>
    <h1><em>404.</em></h1>
    <p class="deck">Wrong turn bbg.</p>
    <p class="sub">This page doesn't exist. Try again.</p>
    <a class="back" href="index.html">← Take Me Home</a>
    <footer>
      <span>© 2026</span>
      <span>NOT AFFILIATED WITH X/TWITTER</span>
    </footer>
  </div>
</body>
</html>
