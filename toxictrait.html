  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f0e8; color: #111; font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
    .container { width: 100%; max-width: 540px; display: flex; flex-direction: column; text-align: center; }
    .masthead { border-top: 4px solid #111; border-bottom: 1.5px solid #111; padding: 0.6rem 0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .masthead-left { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: #555; letter-spacing: 0.1em; }
    .masthead-right { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: #111; letter-spacing: 0.1em; text-decoration: none; border: 1px solid #111; padding: 3px 8px; }
    .masthead-right:hover { color: #c0001a; }
    h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.6rem, 11vw, 6rem); font-weight: 900; line-height: 0.88; letter-spacing: -0.02em; color: #111; border-bottom: 1.5px solid #111; padding-bottom: 1rem; margin-bottom: 1rem; }
    h1 em { font-style: italic; }
    .deck { font-size: 0.8rem; color: #444; border-bottom: 1px solid #ccc; padding-bottom: 1rem; margin-bottom: 1.25rem; line-height: 1.5; }
    .input-area { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.5rem; align-items: center; }
    .input-row { display: flex; width: 100%; }
    .at-sign { background: #111; color: #f5f0e8; font-family: 'DM Mono', monospace; font-size: 1rem; padding: 0 0.75rem; display: flex; align-items: center; border: 2px solid #111; }
    input { flex: 1; background: white; border: 2px solid #111; border-left: none; outline: none; color: #111; font-family: 'DM Mono', monospace; font-size: 1rem; padding: 0.85rem 1rem; }
    input::placeholder { color: #aaa; }
    .input-area button { width: 100%; background: #111; color: #f5f0e8; border: 2px solid #111; font-family: 'Playfair Display', serif; font-size: 0.95rem; font-weight: 900; font-style: normal; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.9rem; cursor: pointer; transition: background 0.15s; }
    .input-area button:hover { background: #333; }
    .input-area button:active { background: #555; }
    @media (min-width: 480px) { .input-area { flex-direction: row; gap: 0; } .input-area button { width: auto; padding: 0 1.25rem; border-left: none; } }
    .result { display: none; flex-direction: column; animation: fadeIn 0.3s ease both; border-top: 4px solid #111; padding-top: 1rem; }
    .result.show { display: flex; }
    .result-byline { font-family: 'DM Sans', monospace; font-size: 0.85rem; color: #222; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.75rem; }

    .verdict-text .username { font-weight: 700; }
    .verdict-text .keyword { color: #c0001a; font-weight: 700; font-style: normal; }
    .btn-row { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 1.75rem; }
    .share-btn { display: none; background: #1d9bf0; color: white; border: none; font-family: 'DM Mono', monospace; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.7rem 1.1rem; cursor: pointer; transition: background 0.15s; text-decoration: none; }
    .share-btn:hover { background: #1a8cd8; }
    .share-btn.show { display: inline-block; }
    .save-btn { display: none; background: #111; color: #f5f0e8; border: none; font-family: 'DM Mono', monospace; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.7rem 1.1rem; cursor: pointer; transition: background 0.15s; }
    .save-btn:hover { background: #333; }
    .save-btn.show { display: inline-block; }
    footer { margin-top: 1.25rem; border-top: 1px solid #ccc; padding-top: 0.75rem; font-family: 'DM Mono', monospace; font-size: 0.7rem; color: #aaa; letter-spacing: 0.08em; display: flex; justify-content: space-between; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    #share-card { position: fixed; left: -9999px; top: 0; width: 540px; background: #f5f0e8; padding: 2rem 1.5rem; }
    #share-card .sc-masthead { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
    #share-card .sc-masthead .sc-rule { flex: 1; height: 1px; background: #111; }
    #share-card .sc-masthead span { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; color: #111; letter-spacing: 0.18em; text-transform: uppercase; white-space: nowrap; }
    #share-card .sc-body { border-top: 4px solid #111; padding-top: 1rem; }
    #share-card .sc-question { font-family: 'DM Mono', monospace; font-size: 10px; color: #777; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 0.5rem; }
    #share-card .sc-question .sc-user { color: #111; font-weight: 700; }
    #share-card .sc-divider { height: 1px; background: #ccc; margin: 0.6rem 0; }
    #share-card .sc-verdict { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 400; line-height: 1.6; color: #111; }
    #share-card .sc-verdict .sc-user { font-weight: 700; }
    #share-card .sc-verdict .sc-kw { color: #c0001a; font-weight: 700; }
    #share-card .sc-footer { margin-top: 1.5rem; border-top: 1px solid #ccc; padding-top: 0.6rem; display: flex; justify-content: space-between; }
    #share-card .sc-footer span { font-family: 'DM Mono', monospace; font-size: 8px; color: #aaa; letter-spacing: 0.08em; }

<body>
  <div class="container">
    <div class="masthead">
      <span class="masthead-left">EST. 2026</span>
      <a class="masthead-right" href="index.html">← ALL TESTS</a>
    </div>
    <h1>What's Your<br><em>Toxic Trait?</em></h1>
    <p class="deck">Proceed with caution.</p>
    <div class="input-area">
      <div class="input-row">
        <span class="at-sign">@</span>
        <input type="text" id="username" placeholder="username" maxlength="30" autocomplete="off" spellcheck="false" />
      </div>
      <button onclick="analyze()">Let's Hear It</button>
    </div>
    <div class="result" id="result">
      <p class="result-byline">Your toxic trait is...</p>
      <div class="verdict-text" id="verdictText"></div>
      <div class="btn-row">
        <a class="share-btn" id="shareBtn" href="#" target="_blank">Share on X →</a>
        <button class="save-btn" id="saveBtn" onclick="saveCard()">Save as Image ↓</button>
      </div>
    </div>
    <footer><span>© 2026</span><span>NOT AFFILIATED WITH X/TWITTER</span></footer>
  </div>

  <div id="share-card">
    <div class="sc-masthead">
      <div class="sc-rule"></div>
      <span>Personality Engine</span>
      <div class="sc-rule"></div>
    </div>
    <div class="sc-body">
      <div class="sc-question" id="sc-question"></div>
      <div class="sc-divider"></div>
      <div class="sc-verdict" id="sc-verdict"></div>
    </div>
    <div class="sc-footer">
      <span>© 2026</span>
      <span class="sc-site"></span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    const input = document.getElementById('username');
    input.addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });

    const responses = [
      "{u}, you take {r:eons to text back}.",
      "{u}, you think you can {r:fix anything} given enough time. But let's be honest, you usually end up breaking things even more.",
      "{u}, you {r:watch TV all day}.",
      "{u}, you don't have a toxic trait. You're {r:green flags all around}. Keep rocking on.",
      "{r:Overconsumption}, {u}. In more ways than one.",
      "You can get a bit {r:jealous}, {u}.",
      "An age-old classic, {u}\u2026 You're a {r:gaslighter}.",
      "You {r:love too hard}, {u}.",
      "You {r:feel everything too deeply}, {u}.",
      "You've got an {r:ego}, {u}.",
      "{u}, you love {r:drama}. It's okay. Most of us do.",
      "You {r:burn bridges and call it growth}, {u}.",
      "You {r:overshare with strangers}, {u}.",
      "You need the {r:last word} every single time, {u}.",
      "{u}, you're {r:chronically online}.",
      "You're {r:too hot and popular}, {u}.",
      "Your {r:standards are so high} that they intimidate people, {u}.",
      "You need {r:constant validation}, {u}.",
      "You {r:run the moment things get real}, {u}.",
      "You {r:hold grudges}, {u}.",
      "You're {r:too proud to ask for help}, {u}.",
      "You turn everything into a {r:competition}, {u}.",
      "You're the reason there's a {r:rule about something}, {u}\u2026 What'd you do?",
      "You're genuinely {r:feral}, {u}. Rock on.",
      "You're {r:super beautiful}, {u}. It's toxic af.",
      "You're always the most {r:passive aggressive} person in any room, {u}.",
      "You have an {r:opinion about everything}, {u}. Even toward things that don't concern you.",
      "You {r:see right through people} but you don't say anything, {u}.",
      "You can come on {r:pretty strong}, {u}.",
      "You {r:sabotage good things} before they can go wrong, {u}.",
      "You {r:thrive in chaos} so much that you subconsciously seek it out, {u}.",
      "You're {r:too hard on yourself}, {u}.",
      "You {r:talk too much}, {u}.",
      "You've got a {r:joke for every funeral}, {u}. Stop it. Don't tell it.",
      "You make {r:references that NOBODY else gets}, {u}.",
      "You {r:quote things at inappropriate moments}, {u}.",
      "You find {r:everything funnier than you should}, {u}.",
      "You're {r:too honest} when you shouldn't be, {u}.",
      "Your toxic trait is your {r:wardrobe}, {u}. Enough said.",
      "Your toxic trait is your {r:music taste}, {u}. Enough said.",
      "You have {r:ZERO in between}, {u}.",
      "You're {r:incapable of a quiet moment}, {u}.",
      "You do things for {r:a reaction}, {u}.",
      "You have about {r:a dozen unfinished projects}, {u}.",
      "You {r:never follow the advice} you give to other people, {u}.",
      "You {r:go silent} instead of saying you're upset, {u}.",
      "You say {r:\"I'm fine\"} when you're not, {u}.",
      "You {r:bring up old arguments} during new ones, {u}.",
      "You're {r:terrified of being truly known}, {u}.",
      "You {r:ghost} instead of confronting difficult conversations, {u}.",
      "You {r:pretend you don't care} so nobody knows you do, {u}.",
      "You need {r:constant control}, {u}.",
      "You {r:manage people's perceptions of you} obsessively, {u}.",
      "You need to know the {r:ending before you start}, {u}.",
      "You're constantly {r:comparing yourself}, {u}.",
      "You {r:never let anyone see you struggle}, {u}.",
      "You {r:care about people who haven't earned it} yet, {u}.",
      "You {r:stay long after you should've left}, {u}.",
      "You have {r:no filter}, {u}."
    ];

    function hash(str) { let h = 0; for (let i = 0; i < str.length; i++) { h = Math.imul(31, h) + str.charCodeAt(i) | 0; } return Math.abs(h); }
    // Site address for share links and the saved image, so nothing is hard-coded
    const SITE = location.origin + location.pathname.replace(/[^/]*$/, '');
    // Opened as a local file, the address would be a folder path on this computer, so show the name instead.
    const SITE_LABEL = location.protocol === 'file:' ? 'Personality Engine' : SITE.replace(/^https?:\/\//, '').replace(/\/$/, '');
    document.querySelectorAll('.sc-site').forEach(el => { el.textContent = SITE_LABEL; });

    function render(template, u) {
      return template
        .replace(/\{u\}/g, `<span class="username">@${u}</span>`)
        .replace(/\{r:([^}]+)\}/g, `<span class="keyword">$1</span>`);
    }
    function renderCard(template, u) {
      return template
        .replace(/\{u\}/g, `<span class="sc-user">@${u}</span>`)
        .replace(/\{r:([^}]+)\}/g, `<span class="sc-kw">$1</span>`);
    }

    function analyze() {
      const u = input.value.trim().replace(/^@/, '').toLowerCase();
      if (!u) return;
      const result = document.getElementById('result');
      result.className = 'result';
      const template = responses[hash(u) % responses.length];
      const plainText = template.replace(/\{u\}/g, '@' + u).replace(/\{r:([^}]+)\}/g, '$1');
      document.getElementById('verdictText').innerHTML = render(template, u);
      document.getElementById('sc-question').innerHTML = `What's <span class="sc-user">@${u}</span>'s toxic trait?`;
      document.getElementById('sc-verdict').innerHTML = renderCard(template, u);
      const shareText = plainText + ' ' + SITE + 'toxictrait.html';
      const shareBtn = document.getElementById('shareBtn');
      shareBtn.href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText);
      shareBtn.classList.add('show');
      document.getElementById('saveBtn').classList.add('show');
      result.className = 'result show';
    }

    function saveCard() {
      html2canvas(document.getElementById('share-card'), { scale: 2, useCORS: true, backgroundColor: '#f5f0e8' }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'personality-engine-toxictrait.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
